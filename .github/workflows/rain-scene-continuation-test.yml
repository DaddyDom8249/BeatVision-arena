name: Controlled Rain Scene Continuation Test

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/rain-scene-continuation-test.mjs"
      - ".github/workflows/rain-scene-continuation-test.yml"

jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Allow provider deployment to settle
        run: sleep 45
      - name: Generate exactly one continuation scene
        run: node tests/rain-scene-continuation-test.mjs > continuation-response.json
      - name: Extract image URL
        run: |
          node <<'NODE'
          const fs = require("fs");
          const x = JSON.parse(fs.readFileSync("continuation-response.json","utf8"));
          const r = x.response;
          const seen = new Set();
          function find(v) {
            if (!v || typeof v !== "object" || seen.has(v)) return null;
            seen.add(v);
            for (const [k,val] of Object.entries(v)) {
              if (typeof val === "string" && (val.startsWith("http://") || val.startsWith("https://")) && /image|url|output|result|asset/i.test(k)) return val;
            }
            for (const val of Object.values(v)) {
              const z = find(val);
              if (z) return z;
            }
            return null;
          }
          const url = find(r);
          fs.writeFileSync("continuation-image-url.txt", url || "NO_IMAGE_URL_RETURNED");
          if (!url) process.exit(2);
          console.log(url);
          NODE
      - name: Download continuation image
        run: |
          URL=$(cat continuation-image-url.txt)
          curl --fail --location --retry 3 --max-time 180 "$URL" -o continuation-test.png
          file continuation-test.png
      - name: Upload continuation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-rain-scene-continuation
          path: |
            continuation-response.json
            continuation-image-url.txt
            continuation-test.png
