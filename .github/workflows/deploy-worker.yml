name: Deploy BeatVision Provider Gateway
# Production deployment workflow; reference-continuation is gated separately.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Run one YouTube reference-continuity gate
        if: github.event.head_commit.message == 'Retry YouTube reference continuity gate'
        env:
          REFERENCE_IMAGE_URL: https://pub-582b7213209642b9b995c96c95a30381.r2.dev/sdxl/prompt-133708738-1790839798765-439420.png
        run: |
          set -u
          mkdir -p gate-output
          cat > gate-request.json <<'JSON'
          {
            "contract_version": "1.1",
            "operation": "referenceContinuation",
            "payload": {
              "reference_image_url": "https://pub-582b7213209642b9b995c96c95a30381.r2.dev/sdxl/prompt-133708738-1790839798765-439420.png",
              "prompt": "Photorealistic cinematic nighttime rain scene viewed through a window. Continue the approved reference image as the same visual world. Preserve the original camera viewpoint, framing, window geometry, lighting, exposure, atmosphere, rainfall direction, and overall composition. Make only subtle natural temporal variation in individual raindrops and distant atmospheric details. No people, faces, animals, vehicles, prominent buildings, text, logos, watermarks, UI, purple, magenta, neon, geometric rain, repeating patterns, or composition changes.",
              "negative_prompt": "purple lighting, magenta, neon, geometric lines, vertical bars, perfectly parallel lines, grid, barcode, repeating streaks, symmetrical rain, artificial particle pattern, cartoon, anime, illustration, fantasy, CGI appearance, oversaturated colors, bright daytime, lightning, text, logo, watermark",
              "prompt_strength": 0.25,
              "cfg": 4.5,
              "steps": 40
            }
          }
          JSON
          HTTP_CODE=$(curl -sS -o gate-output/response.json -w "%{http_code}" -X POST "https://beatvision-provider-arena.richardcranium466.workers.dev/v1/client/image/reference-continuation" -H "Content-Type: application/json" -H "X-BeatVision-Contract: 1.1" -H "X-BeatVision-Request: youtube-reference-continuity-${GITHUB_RUN_ID}" --data-binary @gate-request.json)
          cat gate-output/response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Reference-continuity request failed with HTTP $HTTP_CODE"
            exit 1
          fi
          IMAGE_URL=$(jq -r '.result.image_url // empty' gate-output/response.json)
          if [ -z "$IMAGE_URL" ]; then
            echo "Reference-continuity response did not contain result.image_url"
            exit 1
          fi
          curl -fL --retry 2 --retry-delay 2 "$IMAGE_URL" -o gate-output/continuation.png
          file gate-output/continuation.png
          test -s gate-output/continuation.png

      - name: Upload reference-continuity gate artifact
        if: always() && (contains(github.event.head_commit.modified, 'reference-continuity-gate.trigger') || contains(github.event.head_commit.added, 'reference-continuity-gate.trigger'))
        uses: actions/upload-artifact@v4
        with:
          name: youtube-reference-continuity-gate-${{ github.run_id }}
          path: |
            gate-output/response.json
            gate-output/continuation.png
            gate-request.json
          if-no-files-found: warn
