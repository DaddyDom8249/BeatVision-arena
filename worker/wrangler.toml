name = "beatvision-provider-arena"
main = "src/arena-validated-entry.ts"
compatibility_date = "2026-09-09"

[vars]
ALLOWED_ORIGIN = "https://daddydom8249.github.io,https://beat-vision-theta.vercel.app"
VIDEO_PROVIDER = "pixazo"
PIXAZO_WORLD_IMAGE_MODEL = "flux-schnell"
PIXAZO_SCENE_IMAGE_MODEL = "flux-schnell"
PIXAZO_HERO_IMAGE_MODEL = "sdxl"
EXTERNAL_LANGUAGE_PROVIDER_URL = "https://api.groq.com/openai/v1"
EXTERNAL_LANGUAGE_PROVIDER_MODEL = "openai/gpt-oss-20b"

[[durable_objects.bindings]]
name = "ANIMATION_JOBS"
class_name = "BeatVisionAnimationJob"

[exports.BeatVisionAnimationJob]
type = "durable-object"
storage = "sqlite"

[exports.BeatVisionPipelineJob]
type = "durable-object"
state = "deleted"

# Free Pixazo models used by the active Arena creative path only.
# Shotstack Sandbox remains the deterministic assembly layer.
# Secrets expected by the worker:
# wrangler secret put GATEWAY_TOKEN
# Optional external language/audio providers are configured only when explicitly supplied.
[secrets]
required = ["EXTERNAL_LANGUAGE_PROVIDER_TOKEN"]

# wrangler secret put EXTERNAL_LANGUAGE_PROVIDER_TOKEN
# wrangler secret put EXTERNAL_AUDIO_PROVIDER_TOKEN
# wrangler secret put PIXAZO_API_KEY
# wrangler secret put SHOTSTACK_API_KEY

# EXTERNAL_AUDIO_PROVIDER_URL = "https://your-audio-endpoint/v1/audio/transcriptions"
# EXTERNAL_AUDIO_PROVIDER_MODEL = "your-transcription-model"
