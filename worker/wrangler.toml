name = "beatvision-provider-arena"
main = "src/index.ts"
compatibility_date = "2026-09-09"

[vars]
ALLOWED_ORIGIN = "https://daddydom8249.github.io"
LANGUAGE_PROVIDER_MODEL = "openai/gpt-oss-120b:fastest"
LANGUAGE_PROVIDER = "huggingface"

# Hugging Face language adapter uses the official router by default.
# Keep the provider token in Cloudflare Secrets.
# LANGUAGE_PROVIDER_URL = "https://router.huggingface.co/v1/chat/completions"

# Other provider endpoints remain provider-neutral.
# LANGUAGE_PROVIDER_URL = "https://provider.example/language"
# IMAGE_PROVIDER_URL = "https://provider.example/image"
# VIDEO_PROVIDER_URL = "https://provider.example/video"
# AUDIO_PROVIDER_URL = "https://provider.example/audio"
# STORAGE_PROVIDER_URL = "https://provider.example/storage"

# Secrets expected by the worker:
# wrangler secret put GATEWAY_TOKEN
# wrangler secret put LANGUAGE_PROVIDER_TOKEN
# wrangler secret put IMAGE_PROVIDER_TOKEN
# wrangler secret put VIDEO_PROVIDER_TOKEN
# wrangler secret put AUDIO_PROVIDER_TOKEN
# wrangler secret put STORAGE_PROVIDER_TOKEN
